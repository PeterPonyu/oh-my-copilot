name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate docs-first research repository
        run: bash scripts/validate-doc-links.sh
      - name: Check root mirror drift
        run: bash scripts/check-mirror-drift.sh
      - name: Validate plugin orchestration metadata
        run: node scripts/validate-plugin-orchestration.mjs
      - name: Validate skill receipts and ai-slop integration
        run: node scripts/validate-skill-receipts.mjs
      - name: Validate power surfaces
        run: bash scripts/validate-power-surfaces.sh
      - name: Validate Pages surface
        run: bash scripts/validate-pages-surface.sh
      - name: Validate root Copilot surfaces
        run: bash scripts/validate-root-copilot-surfaces.sh
      - name: Validate release readiness
        run: bash scripts/validate-release-readiness.sh
      - name: Audit MCP tool references
        run: node scripts/audit-tool-refs.mjs
      - name: Verify dist bundle is up to date
        run: |
          cd packages/copilot-cli-plugin/mcp-server
          npm install
          npm run build:bundle
          git diff --exit-code dist/server.mjs || (echo 'dist/server.mjs is stale — run npm run build:bundle and commit'; exit 1)
      - name: Run mcp-server tests
        run: |
          cd packages/copilot-cli-plugin/mcp-server
          npm install --omit=dev
          npm test
      - name: Run plugin E2E validation
        run: bash scripts/run-validation.sh --out .omcp/validation/ci-validation.md --no-redact
      - name: Run Python benchmark tests
        run: python3 -m unittest discover -s benchmark -p 'test*.py'
      - name: Validate cross-host benchmark scripts
        run: |
          node --check scripts/harvest-cross-host-benchmark-data.mjs
          node --check scripts/validate-cross-host-benchmark-data.mjs
          node scripts/validate-cross-host-benchmark-data.mjs \
            --app-root apps/cross-host-benchmark-site
          node --test scripts/tests/harvest-cross-host-benchmark-data.test.mjs
          node --test scripts/tests/validate-cross-host-benchmark-data.test.mjs
