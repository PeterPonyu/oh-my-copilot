name: Deploy Benchmark Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cross-host-benchmark-site/pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js for scripts
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The cross-host benchmark data is harvested manually and committed to
      # the repository (apps/cross-host-benchmark-site/generated/). A harvest
      # step is intentionally omitted from this workflow because harvest
      # requires a local checkout of the oh-my-cursor sibling repo which is
      # not available in CI. Instead, we validate the committed data is
      # structurally sound before building the site. To refresh the data,
      # run scripts/harvest-cross-host-benchmark-data.mjs locally and commit
      # the updated generated/ files.
      - name: Validate committed benchmark data
        run: node scripts/validate-cross-host-benchmark-data.mjs --app-root apps/cross-host-benchmark-site

      - name: Install site dependencies
        working-directory: apps/cross-host-benchmark-site
        run: pnpm install --frozen-lockfile

      - name: Verify site workspace
        working-directory: apps/cross-host-benchmark-site
        run: pnpm test

      - name: Build static export
        working-directory: apps/cross-host-benchmark-site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cross-host-benchmark-site/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
